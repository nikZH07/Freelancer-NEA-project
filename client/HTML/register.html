<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Register</title>
</head>
<body>
    
    <section id="registration-profile">
        <h2>Create Your Account & Profile</h2>
        <form action="/register" method="POST">
            
            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" placeholder="John" required>
            </div>

            <div class="form-group">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" placeholder="Doe" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="07123 456789" required>
            </div>

            <div class="form-group">
                <label for="password">Create Password:</label>
                <input type="password" id="password" name="password" placeholder="Min 8 characters" required>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <h3>Professional Details</h3>

            <div class="form-group">
                <label for="headline">Professional Headline:</label>
                <input type="text" id="headline" name="headline" placeholder="e.g. Expert Web Developer" required>
            </div>

            <div class="form-group">
                <label for="category">Main Industry:</label>
                <select id="category" name="category" required>
                    <option value="">--Please choose an option--</option>
                    <option value="tech">Technology & IT</option>
                    <option value="manual">Manual Labour</option>
                    <option value="creative">Creative & Design</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bio">Bio & Experience:</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Tell us about your skills..." required></textarea>
            </div>

            <div class="form-group">
                <label for="years">Years of Experience:</label>
                <input type="number" id="years" name="years" min="0" max="50" required>
            </div>

            <button type="submit">Register & Create Profile</button>
        </form>
    </section>

    <style>
        #registration-profile {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2, h3 {
            color: #2c3e50;
            margin-top: 0;
        }

        h3 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #34495e;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
            background-color: #f7fbff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #219150;
        }

        .form-group div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="radio"] {
            margin: 0;
            cursor: pointer;
        }
    </style>

</body>
</html>
