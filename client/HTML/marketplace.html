<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Marketplace</title>
</head>
<body>
    
    <div id="modalBackdrop" class="hidden"></div>

    <div class="create_job_menu">
        <div class="top_layer">
            <h1 style="text-decoration: underline; font-size: 2.7rem;">Post a job</h1>
            <button class="close_window_btn"><i class="fa-solid fa-x" style="color: rgb(255, 255, 255);"></i></button>
        </div>
        <div class="middle_layer">
            <form class="jobForm">
                <input type="text" name="jobtitle" placeholder="Job title:" class="jobtitle job_info_inp" required>
                <input type="text" name="jobdescription" placeholder="Job description:" class="jobdescription job_info_inp" required>
                <button type="submit" class="job_post_submit">Submit</button>
            </form>
        </div>
    </div>

    <!-- nav bar -->

    <div class="wrapper_outer">
        <button class="create_job_btn">
            + Create
        </button>

        <div class="wrapper_inner">
            <a href="marketplace.html"><button class="page_redirect posted_jobs_redirect"><i class="fa-solid fa-shop page_icon" style="color: rgb(34, 52, 90);"></i></button></a>
            <a href="posted_jobs.html"><button class="page_redirect"><i class="fa-solid fa-envelope page_icon"></i></button></a>
            <a href="settings.html"><button class="page_redirect"><i class="fa-solid fa-gear page_icon"></i></button></a>
        </div>
    </div>

    <!-- main page -->

    <div class="view_all_jobs_container">

        <!-- <div class="job_box">
            <p class="job_title">asdasdas</p>
            <p class="job_description">asdasda</p>
            <div class="job_info">
                <p>by Admin Admin</p>
                <p>Posted date: 2026-09-03</p>
            </div>
            <button class="market_accept_btn">ACCEPT</button>
        </div> -->

    </div>

    <script src="../JS/marketplace.js"></script>

</body>
</html>
