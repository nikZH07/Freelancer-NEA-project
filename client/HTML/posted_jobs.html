        </div>

    <!-- create job menu popup -->

    <div id="modalBackdrop" class="hidden"></div>

    <div class="create_job_menu">
        <div class="top_layer">
            <h1 style="text-decoration: underline; font-size: 2.7rem;">Post a job</h1>
            <button class="close_window_btn"><i class="fa-solid fa-x" style="color: rgb(255, 255, 255);"></i></button>
        </div>
        <div class="middle_layer">
            <form class="jobForm">
                <input type="text" name="jobtitle" placeholder="Job title:" class="jobtitle job_info_inp" required>
                <input type="text" name="jobdescription" placeholder="Job description:" class="jobdescription job_info_inp" required>
                <button type="submit" class="job_post_submit">Submit</button>
            </form>
        </div>
    </div>

    <!-- view profile menu popup -->

    <div id="profileModal" class="create_job_menu hidden">
        <div class="top_layer">
            <h1 style="text-decoration: underline; font-size: 2.7rem;">Worker Profile</h1>
            <button class="close_profile_btn"><i class="fa-solid fa-x" style="color: white;"></i></button>
        </div>
        <div class="middle_layer" style="color: white; padding: 20px;">
            <h2 id="p_name" style="margin-bottom: 5px;">Loading...</h2>
            <p id="p_title" style="color: #3498db; font-weight: bold; margin-bottom: 15px;"></p>
            
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;">
                <p><strong>Industry:</strong> <span id="p_industry"></span></p>
                <p><strong>Experience:</strong> <span id="p_exp"></span> years</p>
                <p><strong>Phone:</strong> <span id="p_phone"></span></p>
                <hr style="border: 0.5px solid #444; margin: 15px 0;">
                <p><strong>Bio:</strong></p>
                <p id="p_bio" style="font-style: italic; color: #ccc;"></p>
            </div>
        </div>
    </div>
